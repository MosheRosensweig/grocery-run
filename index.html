/* =========================================================
   CATEGORIZE ITEM
========================================================= */

function categorizeItem(item) {

  const text =
    item.toLowerCase().trim();


  /*
   * Check more specific categories first.
   */

  const priority = [
    "Meat & Fish",
    "Dairy & Eggs",
    "Frozen",
    "Bakery",
    "Produce",
    "Drinks",
    "Snacks",
    "Personal Care",
    "Household",
    "Pantry"
  ];


  for (const category of priority) {

    const keywords =
      CATEGORY_KEYWORDS[category];


    if (
      keywords.some(keyword =>
        text.includes(keyword)
      )
    ) {

      return category;

    }

  }


  return "Other";
}

  $("status").className =

/* =========================================================
   GOOGLE AUTH
========================================================= */

function startGoogle() {

  if (!window.google?.accounts?.oauth2) {

    setLoginStatus(
      "Google sign-in is still loading. Try again in a moment."
    );

    return;
  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        CONFIG.clientId,

      scope:
        CONFIG.scope,

      callback:
        async response => {

          if (response.error) {

            setLoginStatus(
              "Google authorization failed."
            );

            return;
          }


          accessToken =
            response.access_token;


          loginCard.hidden =
            true;

          appPanel.hidden =
            false;


          await load();


          startAutoSync();

        }

    });


  tokenClient.requestAccessToken({
    prompt: ""
  });

}


$("loginBtn").onclick =
  startGoogle;


/* =========================================================
   AUTH HEADERS
========================================================= */

function authHeaders() {

  if (!accessToken) {

    throw new Error(
      "Please sign in with Google."
    );

  }


  return {
    Authorization:
      "Bearer " + accessToken
  };

}


/* =========================================================
   GOOGLE SHEETS API
========================================================= */

async function sheetsFetch(
  path,
  options = {}
) {

  const response =
    await fetch(

      API +
      "/" +
      CONFIG.spreadsheetId +
      path,

      {
        ...options,

        headers: {

          ...authHeaders(),

          ...(options.headers || {})

        }

      }

    );


  if (response.status === 401) {

    accessToken =
      null;

    stopAutoSync();

    throw new Error(
      "Your Google authorization expired. Please sign in again."
    );

  }


  if (response.status === 429) {

    throw new Error(
      "RATE_LIMIT"
    );

  }


  if (!response.ok) {

    let message =
      response.statusText;


    try {

      const data =
        await response.json();

      message =
        data.error?.message ||
        message;

    }
    catch {}


    throw new Error(
      message
    );

  }


  return response.json();

}


/* =========================================================
   LOAD LIST
========================================================= */

async function load(options = {}) {

  const silent =
    options.silent === true;


  if (syncInProgress) {
    return;
  }


  if (!accessToken) {
    return;
  }


  syncInProgress =
    true;


  if (!silent) {

    setStatus(
      "Loading…"
    );

  }


  $("refreshBtn").disabled =
    true;


  try {

    const range =
      encodeURIComponent(
        `${CONFIG.sheetName}!A:A`
      );


    const data =
      await sheetsFetch(
        `/values/${range}?majorDimension=ROWS`
      );


    const values =
      data.values || [];


    const newItems =
      values

        .map((row, index) => ({

          row:
            index + 1,

          value:
            String(
              row[0] ?? ""
            ).trim()

        }))

        .filter(item =>
          item.value
        );


    /*
     * Determine whether the actual
     * grocery list changed.
     */

    const changed =
      newItems.length !== items.length ||

      newItems.some(
        (item, index) =>
          item.value !==
          items[index]?.value
      );


    items =
      newItems;


    if (changed) {

      render();

    }


    /*
     * This changes on EVERY successful
     * sync, even if nothing changed.
     */

    updateLastUpdated();


    rateLimitBackoff =
      0;


    if (!silent) {

      setStatus(

        items.length
          ? `${items.length} item${
              items.length === 1
                ? ""
                : "s"
            }`
          : ""

      );

    }

  }
  catch (error) {

    if (
      error.message ===
      "RATE_LIMIT"
    ) {

      rateLimitBackoff =
        Math.min(
          rateLimitBackoff + 1,
          5
        );


      const delay =
        Math.pow(
          2,
          rateLimitBackoff
        ) * 1000;


      setTimeout(() => {

        if (
          accessToken &&
          !document.hidden
        ) {

          load({
            silent: true
          });

        }

      }, delay);

    }
    else {

      if (
        /authorization expired|sign in/i
          .test(error.message)
      ) {

        stopAutoSync();

        appPanel.hidden =
          true;

        loginCard.hidden =
          false;

      }
      else {

        setStatus(
          error.message,
          true
        );

      }

    }

  }
  finally {

    syncInProgress =
      false;

    $("refreshBtn").disabled =
      false;

  }

}


/* =========================================================
   AUTO SYNC
========================================================= */

function startAutoSync() {

  stopAutoSync();


  if (!accessToken) {
    return;
  }


  if (document.hidden) {
    return;
  }


  syncTimer =
    setInterval(() => {

      if (!accessToken) {
        return;
      }


      if (document.hidden) {
        return;
      }


      if (syncInProgress) {
        return;
      }


      load({
        silent: true
      });

    }, CONFIG.syncInterval);

}


function stopAutoSync() {

  if (syncTimer !== null) {

    clearInterval(
      syncTimer
    );

    syncTimer =
      null;

  }

}


/* =========================================================
   TAB VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (document.hidden) {

      stopAutoSync();

      return;

    }


    if (accessToken) {

      load({
        silent: true
      });

      startAutoSync();

    }

  }
);


/* =========================================================
   CONFETTI
========================================================= */

function confettiExplosion(button) {

  const rect =
    button.getBoundingClientRect();


  const centerX =
    rect.left +
    rect.width / 2;


  const centerY =
    rect.top +
    rect.height / 2;


  const colors = [
    "#ff595e",
    "#ffca3a",
    "#8ac926",
    "#1982c4",
    "#6a4c93",
    "#ff70a6",
    "#00c2a8"
  ];


  const pieces = 80;


  for (let i = 0; i < pieces; i++) {

    const piece =
      document.createElement(
        "div"
      );


    piece.style.position =
      "fixed";

    piece.style.left =
      centerX + "px";

    piece.style.top =
      centerY + "px";

    piece.style.width =
      (5 + Math.random() * 7) + "px";

    piece.style.height =
      (7 + Math.random() * 10) + "px";

    piece.style.background =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];

    piece.style.borderRadius =
      Math.random() > 0.5
        ? "50%"
        : "2px";

    piece.style.pointerEvents =
      "none";

    piece.style.zIndex =
      "9999";


    const angle =
      Math.random() *
      Math.PI *
      2;


    const velocity =
      100 +
      Math.random() * 220;


    const x =
      Math.cos(angle) *
      velocity;


    const y =
      Math.sin(angle) *
      velocity;


    const rotation =
      Math.random() *
      720 -
      360;


    piece.animate(

      [
        {
          transform:
            "translate(-50%, -50%) rotate(0deg)",
          opacity: 1
        },

        {
          transform:
            `translate(
              calc(-50% + ${x}px),
              calc(-50% + ${y + 140}px)
            )
            rotate(${rotation}deg)`,
          opacity: 0
        }
      ],

      {
        duration:
          700 +
          Math.random() * 600,

        easing:
          "cubic-bezier(.15,.8,.3,1)"
      }

    );


    document.body.appendChild(
      piece
    );


    setTimeout(() => {

      piece.remove();

    }, 1400);

  }

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  const list =
    $("list");


  list.innerHTML =
    "";


  if (!items.length) {

    $("empty").hidden =
      false;

    return;

  }


  $("empty").hidden =
    true;


  /*
   * Group items by store section.
   */

  const groups = {};


  CATEGORY_ORDER.forEach(
    category => {
      groups[category] = [];
    }
  );


  items.forEach(item => {

    const category =
      categorizeItem(
        item.value
      );


    groups[category].push(
      item
    );

  });


  /*
   * Draw each category.
   */

  CATEGORY_ORDER.forEach(
    category => {

      const categoryItems =
        groups[category];


      if (!categoryItems.length) {
        return;
      }


      const section =
        document.createElement(
          "section"
        );

      section.className =
        "grocery-section";


      const heading =
        document.createElement(
          "div"
        );

      heading.className =
        "grocery-section-heading";


      const icon =
        document.createElement(
          "span"
        );

      icon.className =
        "category-icon";

      icon.textContent =
        CATEGORY_ICONS[category];


      const title =
        document.createElement(
          "span"
        );

      title.textContent =
        category;


      heading.append(
        icon,
        title
      );


      section.append(
        heading
      );


      categoryItems.forEach(
        item => {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "item";


          const itemIcon =
            document.createElement(
              "span"
            );

          itemIcon.className =
            "item-icon";

          itemIcon.textContent =
            getItemIcon(
              item.value
            );


          const name =
            document.createElement(
              "span"
            );

          name.className =
            "item-name";

          name.textContent =
            item.value;


          const done =
            document.createElement(
              "button"
            );

          done.className =
            "remove";

          done.textContent =
            "Done";


          done.onclick =
            () => {

              confettiExplosion(
                done
              );

              removeItem(
                items.indexOf(
                  item
                )
              );

            };


          row.append(
            itemIcon,
            name,
            done
          );


          section.append(
            row
          );

        }
      );


      list.append(
        section
      );

    }
  );

}


/* =========================================================
   ADD ITEM
========================================================= */

async function addItem(value) {

  setStatus(
    "Adding…"
  );


  try {

    const values =
      await sheetsFetch(

        `/values/${encodeURIComponent(
          CONFIG.sheetName + "!A:A"
        )}?majorDimension=ROWS`

      );


    const rows =
      values.values || [];


    let target =
      rows.findIndex(
        row =>
          !String(
            row[0] ?? ""
          ).trim()
      );


    if (target < 0) {

      target =
        rows.length;

    }


    const rangeA1 =
      `${CONFIG.sheetName}!A${target + 1}`;


    const range =
      encodeURIComponent(
        rangeA1
      );


    await sheetsFetch(

      `/values/${range}?valueInputOption=USER_ENTERED`,

      {

        method:
          "PUT",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            range:
              rangeA1,

            majorDimension:
              "ROWS",

            values:
              [[value]]

          })

      }

    );


    $("itemInput").value =
      "";


    await load();

  }
  catch (error) {

    setStatus(
      error.message === "RATE_LIMIT"
        ? "Google rate limit reached. Please try again in a moment."
        : error.message,
      true
    );

  }

}


/* =========================================================
   REMOVE ITEM
========================================================= */

async function removeItem(index) {

  const item =
    items[index];


  if (!item) {
    return;
  }


  setStatus(
    "Removing…"
  );


  try {

    const rangeA1 =
      `${CONFIG.sheetName}!A${item.row}`;


    await sheetsFetch(

      `/values/${encodeURIComponent(
        rangeA1
      )}:clear`,

      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          "{}"

      }

    );


    await load();

  }
  catch (error) {

    setStatus(
      error.message === "RATE_LIMIT"
        ? "Google rate limit reached. Please try again in a moment."
        : error.message,
      true
    );

  }

}


/* =========================================================
   FORM
========================================================= */

$("addForm").onsubmit =
  event => {

    event.preventDefault();


    const value =
      $("itemInput")
        .value
        .trim();


    if (value) {

      addItem(
        value
      );

    }

  };


/* =========================================================
   MANUAL REFRESH
========================================================= */

$("refreshBtn").onclick =
  () => {

    load();

  };


/* =========================================================
   SIGN OUT
========================================================= */

$("signOutBtn").onclick =
  () => {

    stopAutoSync();


    if (
      accessToken &&
      google?.accounts?.oauth2
    ) {

      google.accounts.oauth2.revoke(
        accessToken,
        () => {}
      );

    }


    accessToken =
      null;


    appPanel.hidden =
      true;

    loginCard.hidden =
      false;


    $("lastUpdated").textContent =
      "Last updated: —";


    setLoginStatus(
      "Signed out."
    );

  };


/* =========================================================
   INITIAL SETUP
========================================================= */

window.addEventListener(
  "load",
  () => {

    setTimeout(() => {

      if (
        CONFIG.clientId.includes(
          "PASTE_YOUR"
        )
      ) {

        setLoginStatus(
          "Set your Google OAuth Web Client ID in index.html first."
        );


        $("loginBtn").disabled =
          true;

      }

    }, 500);

  }
);

</script>
