  <style>
    *{box-sizing:border-box}
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#24231f;background:#f6f4ef}
    body{margin:0;min-height:100vh;background:#f6f4ef;-webkit-font-smoothing:antialiased}
    [hidden]{display:none !important}
    .app{width:min(680px,100%);margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .eyebrow{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.55}
    h1{margin:0;font-size:clamp(28px,7vw,42px);line-height:1.05;letter-spacing:-.03em}
    h2{margin:0 0 8px;font-size:24px}
    p{line-height:1.45}

    .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.055)}
    .login-card{margin-top:18px}
    .small{font-size:13px;opacity:.6;min-height:20px}
    .primary{height:50px;padding:0 20px;border:0;border-radius:14px;background:#24231f;color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;transition:transform .1s,opacity .1s}
    .icon-button{width:46px;height:46px;border:0;border-radius:50%;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center}
    .reconnect-banner{background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background 0.2s}
    .reconnect-banner:hover{background:#fde68a}

    .tabs{display:flex;gap:10px;margin-bottom:20px}
    .tab{flex:1;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:600;background:#e5e7eb;color:#4b5563;cursor:pointer;transition:all 0.2s}
    .tab.active{background:#111827;color:#ffffff}

    .status{min-height:22px;padding:2px 4px 6px;font-size:13px;opacity:.55}
    .status.error{color:#a33;opacity:1}

    /* ADD FORM CONTAINER */
    .add-form-container{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;background:#ffffff;padding:14px;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.055);border:1px solid rgba(0,0,0,.04)}
    .add-input-row{display:flex;gap:8px;align-items:center}
    .input-autocomplete-wrapper{position:relative;flex:1;min-width:0;display:flex;align-items:center}
    .input-autocomplete-wrapper input{width:100%;min-width:0;height:50px;border:1.5px solid #d7d3ca;border-radius:14px;background:#fff;padding:0 14px;font-size:16px;color:#111827;outline:none;-webkit-appearance:none;position:relative;z-index:1;background:transparent}
    .input-autocomplete-wrapper input:focus{border-color:#24231f;box-shadow:0 0 0 3px rgba(36,35,31,.08)}
    .ghost-text-overlay{position:absolute;left:0;top:0;width:100%;height:100%;padding:0 14px;display:flex;align-items:center;font-size:16px;font-family:inherit;line-height:50px;pointer-events:none;white-space:pre;overflow:hidden;border:1.5px solid transparent;box-sizing:border-box;background:#fff;border-radius:14px;z-index:0}
    .ghost-text-typed{color:transparent}
    .ghost-text-suffix{color:#9ca3af;font-weight:400}
    .ghost-text-badge{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:28px;padding:0 10px;border-radius:8px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:700;border:1px solid #d1d5db;cursor:pointer;display:flex;align-items:center;gap:4px;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,0.05)}

    .preview-label{white-space:nowrap;flex-shrink:0}

    .category-select:focus{border-color:#24231f}

    .icon-picker-btn{width:42px;height:42px;min-width:42px;font-size:22px;border:1.5px solid #d7d3ca;border-radius:12px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;flex-shrink:0;padding:0}
    .icon-picker-btn:hover{transform:scale(1.05)}

    .color-picker-wrapper{position:relative;width:42px;height:42px;min-width:42px;border-radius:12px;border:1.5px solid #d7d3ca;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0}
    .color-picker-wrapper input[type="color"]{position:absolute;inset:0;width:200%;height:200%;opacity:0;cursor:pointer;border:0;padding:0}
    .color-swatch{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:16px;pointer-events:none}

    /* GROCERY LIST & ITEMS */
    .list{display:grid;gap:9px}
    .grocery-section{margin-bottom:8px}
    .grocery-section-heading{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin:12px 4px 6px}
    .category-icon{font-size:16px}

    .item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:8px 10px 8px 14px;border-radius:14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform 0.15s ease, opacity 0.15s ease}
    .item.holding{transform:scale(0.97);opacity:0.85}
    .item.editing{user-select:text;-webkit-user-select:text;box-shadow:0 0 0 2px #24231f, 0 4px 14px rgba(0,0,0,.1);padding:12px}
    .item span{font-size:18px;line-height:1.25;overflow-wrap:anywhere}
    .remove{flex:0 0 auto;min-width:64px;min-height:44px;border:0;border-radius:11px;background:#ece9e1;color:#24231f;font-size:14px;font-weight:700;cursor:pointer}

    /* EDIT FORM IN ROWS */
    .edit-form-expanded{display:flex;flex-direction:column;gap:10px;width:100%}
    .edit-row-main{display:flex;align-items:center;gap:8px;width:100%}
    .edit-row-controls{display:flex;align-items:center;gap:8px;width:100%}
    .edit-input{flex:1;min-width:0;height:42px;border:1.5px solid #24231f;border-radius:10px;padding:0 12px;font-size:16px;font-weight:600;background:#fff;color:#111827;outline:none;-webkit-appearance:none}
    .save-btn{height:42px;padding:0 14px;border:0;border-radius:10px;background:#24231f;color:#fff;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
    .cancel-btn{height:42px;padding:0 12px;border:0;border-radius:10px;background:#e5e7eb;color:#374151;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}

    /* BIKE VIEW */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px;justify-content:center}
    .stat-card{background:#ffffff;padding:16px 8px;border-radius:8px;text-align:center;border:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(0,0,0,0.05);display:flex;flex-direction:column;align-items:center;justify-content:center}
    .stat-card-last{grid-column:1/-1;justify-self:center;width:100%;max-width:220px}
    .stat-label{font-size:0.7rem;color:#6b7280;text-transform:uppercase;font-weight:700;margin-bottom:6px;line-height:1.2;text-align:center;width:100%}
    .stat-value{font-size:1.1rem;font-weight:800;color:#111827;text-align:center;width:100%}
    .bike-list{display:flex;flex-direction:column;gap:8px;margin-top:24px}
    .bike-date-row{background:#ffffff;padding:14px 16px;border-radius:8px;font-weight:600;color:#374151;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #e5e7eb}
    .bike-date-row::before{content:"🚲";margin-right:12px;font-size:1.2rem}

    /* ICON MODAL */
    .icon-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
    .icon-modal-overlay[hidden]{display:none !important}
    .icon-modal{background:#fff;border-radius:20px;width:min(480px,100%);max-height:80vh;display:flex;flex-direction:column;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .icon-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .icon-modal-close{width:36px;height:36px;border:0;border-radius:50%;background:#f3f4f6;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .icon-search-input{height:44px;border:1.5px solid #d7d3ca;border-radius:12px;padding:0 14px;font-size:16px;outline:none;margin-bottom:12px;-webkit-appearance:none}
    .icon-search-input:focus{border-color:#24231f}
    .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;overflow-y:auto;max-height:360px;padding:4px}
    .icon-item{width:44px;height:44px;font-size:22px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .1s}
    .icon-item:hover{transform:scale(1.1);background:#e5e7eb}

    .signout{display:block;margin:24px auto 0;border:0;background:none;font-size:14px;opacity:.55;cursor:pointer}
    .empty{margin:45px 0;text-align:center;opacity:.5}
    button:active{transform:scale(.97)}
    @media(min-width:600px){.app{padding-top:48px}}
  </style>
</head>

<body>
<main class="app">

  <header>
    <div>
      <p class="eyebrow">STUFF TO BUY</p>
      <h1 id="headerTitle">What do we need?</h1>
    </div>

    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" id="reconnectBtn" class="reconnect-banner" hidden title="Tap to reconnect Google Sheets">⚠️ Reconnect</button>
      <button class="icon-button" id="refreshBtn" aria-label="Refresh">
        ↻
      </button>
    </div>
  </header>


  <!-- LOGIN -->

  <section id="loginCard" class="card login-card">
    <h2>Connect your Google account</h2>

    <p>
      You and your wife can use your own Google accounts.
      The app only requests access to this spreadsheet.
    </p>

    <button id="loginBtn" class="primary">
      Sign in with Google
    </button>

    <p id="loginStatus" class="small"></p>
  </section>


  <!-- APP -->

  <section id="appPanel" hidden>

    <!-- TABS -->
    <nav class="tabs">
      <button id="tabGroceries" class="tab active">Groceries</button>
      <button id="tabBike" class="tab">Bike Days</button>
    </nav>

    <!-- SHARED STATUS -->
    <div id="status" class="status"></div>


    <!-- GROCERY VIEW -->
    <div id="groceryView">
      <form id="addForm" class="add-form-container">
        <div class="add-input-row">
          <div class="input-autocomplete-wrapper">
            <div id="ghostTextOverlay" class="ghost-text-overlay" aria-hidden="true"></div>
            <input
              id="itemInput"
              autocomplete="off"
              autocapitalize="words"
              placeholder="Add an item…"
              aria-label="New grocery item"
              required
            >
            <button type="button" id="ghostTextBadge" class="ghost-text-badge" hidden title="Tap to accept suggestion">⇥</button>
          </div>
          <button type="submit" class="primary">
            Add
          </button>
        </div>
        <div id="addPreviewBar" class="add-preview-bar">
          <label class="preview-field">
            <span class="preview-label">Category:</span>
            <select id="addCategorySelect" class="category-select" aria-label="Select category"></select>
          </label>
          <button type="button" id="addIconBtn" class="icon-picker-btn" title="Choose Icon">🛒</button>
          <label class="color-picker-wrapper" title="Choose Custom Color">
            <input type="color" id="addColorInput" value="#ffffff">
            <span id="addColorSwatch" class="color-swatch">🎨</span>
          </label>
        </div>
      </form>

      <section
        id="list"
        class="list"
        aria-live="polite">
      </section>

      <p id="empty" class="empty" hidden>
        Your grocery list is empty.
      </p>
    </div>


    <!-- BIKE VIEW -->
    <div id="bikeView" hidden>
      <div class="stats-grid" id="statsGrid">
        <!-- Dynamically rendered stat cards from columns C & D -->
      </div>

      <button id="addTodayBtn" class="primary" style="width: 100%;">
        Add Today
      </button>

      <section id="bikeList" class="bike-list"></section>
    </div>


    <!-- SHARED FOOTER -->
    <p
      id="lastUpdated"
      class="small last-updated">
      Last updated: —
    </p>

    <button id="signOutBtn" class="signout">
      Sign out
    </button>

  </section>

  <!-- SEARCHABLE ICON PICKER MODAL -->
  <div id="iconModal" class="icon-modal-overlay" hidden>
    <div class="icon-modal">
      <div class="icon-modal-header">
        <h3 style="margin:0;">Choose Icon</h3>
        <button type="button" id="closeIconModal" class="icon-modal-close" aria-label="Close icon picker">✕</button>
      </div>
      <input type="text" id="iconSearchInput" class="icon-search-input" placeholder="Search icons (e.g. apple, milk, bread)..." autocomplete="off">
      <div id="iconGrid" class="icon-grid"></div>
    </div>
  </div>

</main>

/* =========================================================

========================================================= */

function categorizeItem(item) {
  const text = item.toLowerCase().trim();
  const priority = ["Meat & Fish", "Dairy & Eggs", "Frozen", "Bakery", "Produce", "Drinks", "Snacks", "Personal Care", "Household", "Pantry"];
  for (const category of priority) {
    if (CATEGORY_KEYWORDS[category].some(kw => text.includes(kw))) return category;
  }
  return "Other";
}

function getItemDetails(itemText) {
  const text = itemText.toLowerCase().trim();
  for (const rule of ITEM_RULES) {
    if (rule.pattern.test(text)) return rule;
  }
  const cat = categorizeItem(itemText);
  return { icon: CATEGORY_ICONS[cat] || "🛒", bg: "#f3f4f6", color: "#1f2937" };
}

/* =========================================================
   GOOGLE LOGIN & TOKEN PERSISTENCE
========================================================= */

function handleTokenReceived(token, expiresInSeconds = 3600) {
  accessToken = token;
  const expiryTime = Date.now() + (expiresInSeconds * 1000) - 60000; // 1 min buffer
  localStorage.setItem("google_access_token", token);
  localStorage.setItem("google_token_expiry", expiryTime);
  localStorage.setItem("has_connected_google", "true");
  localStorage.setItem("autoLogin", "true");

  loginCard.hidden = true;
  appPanel.hidden = false;
  const recBtn = $("reconnectBtn");
  if (recBtn) recBtn.hidden = true;
  load({ silent: true });
  startAutoSync();
}

function refreshTokenSilently() {
  return new Promise((resolve) => {
    if (!window.google?.accounts?.oauth2) return resolve(false);
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.clientId,
        scope: CONFIG.scope,
        callback: response => {
          if (!response.error && response.access_token) {
            handleTokenReceived(response.access_token, response.expires_in || 3600);
            resolve(true);
          } else {
            resolve(false);
          }
        }
      });
      tokenClient.requestAccessToken({ prompt: "" });
    } catch {
      resolve(false);
    }
  });
}

function requestUserAuth() {
  return new Promise((resolve) => {
    if (!window.google?.accounts?.oauth2) {
      setLoginStatus("Google sign-in is still loading. Try again in a moment.");
      return resolve(false);
    }
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.clientId,
        scope: CONFIG.scope,
        callback: response => {
          if (!response.error && response.access_token) {
            handleTokenReceived(response.access_token, response.expires_in || 3600);
            resolve(true);
          } else {
            setLoginStatus("Google authorization failed.");
            resolve(false);
          }
        }
      });
      tokenClient.requestAccessToken({ prompt: "" });
    } catch (e) {
      setLoginStatus("Error initiating sign-in: " + e.message);
      resolve(false);
    }
  });
}

async function ensureValidToken(interactive = false) {
  const cachedToken = localStorage.getItem("google_access_token");
  const tokenExpiry = parseInt(localStorage.getItem("google_token_expiry") || "0", 10);

  if (cachedToken && Date.now() < tokenExpiry) {
    accessToken = cachedToken;
    const recBtn = $("reconnectBtn");
    if (recBtn) recBtn.hidden = true;
    return true;
  }

  if (!interactive) {
    const ok = await refreshTokenSilently();
    if (ok) return true;
    if (localStorage.getItem("has_connected_google") === "true") {
      const recBtn = $("reconnectBtn");
      if (recBtn) recBtn.hidden = false;
    }
    return false;
  } else {
    const ok = await requestUserAuth();
    if (ok) return true;
    return false;
  }
}

function startGoogle() {
  requestUserAuth();
}

$("loginBtn").onclick = startGoogle;

function authHeaders() {
  if (!accessToken) throw new Error("Please sign in with Google.");
  return { Authorization: "Bearer " + accessToken };
}

/* =========================================================
   SHEETS API
========================================================= */

async function sheetsFetch(path, options = {}, isRetry = false) {
  const tokenExpiry = parseInt(localStorage.getItem("google_token_expiry") || "0", 10);
  if (!accessToken || Date.now() >= tokenExpiry) {
    const refreshed = await ensureValidToken(false);
    if (!refreshed && !accessToken) {
      const recBtn = $("reconnectBtn");
      if (recBtn) recBtn.hidden = false;
      throw new Error("AUTH_PAUSED");
    }
  }

  const response = await fetch(API + "/" + CONFIG.spreadsheetId + path, {
    ...options,
    headers: { ...authHeaders(), ...(options.headers || {}) }
  });

  if (response.status === 401) {
    accessToken = null;
    localStorage.removeItem("google_access_token");
    if (!isRetry) {
      const refreshed = await ensureValidToken(false);
      if (refreshed) {
        return sheetsFetch(path, options, true);
      }
    }
    const recBtn = $("reconnectBtn");
    if (recBtn) recBtn.hidden = false;
    throw new Error("AUTH_PAUSED");
  }

  if (response.status === 429) throw new Error("RATE_LIMIT");

  if (!response.ok) {
    let message = response.statusText;
    try {
      const data = await response.json();
      message = data.error?.message || message;
    } catch {}
    throw new Error(message);
  }
  return response.json();
}

/* =========================================================
   LOAD
========================================================= */

async function load(options = {}) {
  const silent = options.silent === true;
  if (syncInProgress) return;

  if (!accessToken) {
    const ok = await ensureValidToken(false);
    if (!ok) {
      if (!silent) setStatus(items.length ? `${items.length} item${items.length === 1 ? "" : "s"} (cached)` : "");
      return;
    }
  }

  syncInProgress = true;
  if (!silent) setStatus("Loading…");
  $("refreshBtn").disabled = true;

  try {
    if (currentTab === 'groceries') {
      const range = encodeURIComponent(`${CONFIG.sheetName}!A:D`);
      const data = await sheetsFetch(`/values/${range}?majorDimension=ROWS`);
      const values = data.values || [];

      const newItems = values
        .map((row, index) => {
          const val = String(row[0] ?? "").trim();
          if (!val) return null;
          return {
            row: index + 1,
            value: val,
            category: String(row[1] ?? "").trim() || null,
            icon: String(row[2] ?? "").trim() || null,
            color: String(row[3] ?? "").trim() || null
          };
        })
        .filter(Boolean);

      const changed = newItems.length !== items.length || newItems.some((item, index) => {
        const existing = items[index];
        if (!existing) return true;
        return item.value !== existing.value || item.category !== existing.category || item.icon !== existing.icon || item.color !== existing.color;
      });
      items = newItems;

      if (changed && editingItemRow === null) renderGroceries();
      localStorage.setItem("cached_groceries", JSON.stringify(items));
      if (!silent) setStatus(items.length ? `${items.length} item${items.length === 1 ? "" : "s"}` : "");

    } else if (currentTab === 'bike') {
      const range = encodeURIComponent(`${CONFIG.bikeSheetName}!A:D`);
      const data = await sheetsFetch(`/values/${range}?majorDimension=ROWS`);
      const rows = data.values || [];

      let newBikeDates = [];
      let newStatCards = [];

      rows.forEach((row, index) => {
        const dateVal = String(row[0] ?? "").trim();
        if (dateVal) newBikeDates.push({ row: index + 1, value: dateVal });

        const label = String(row[2] ?? "").trim();
        const val = String(row[3] ?? "").trim();
        if (label) {
          newStatCards.push({ label, value: val !== "" ? val : "0" });
        }
      });

      newStatCards.sort((a, b) => {
        const aIsPercent = /%|percent/i.test(a.label);
        const bIsPercent = /%|percent/i.test(b.label);
        if (aIsPercent && !bIsPercent) return 1;
        if (!aIsPercent && bIsPercent) return -1;
        return 0;
      });

      bikeDates = newBikeDates;
      statCardsData = newStatCards;
      renderStatsGrid();
      renderBikeList();
      localStorage.setItem("cached_bike_dates", JSON.stringify(bikeDates));
      localStorage.setItem("cached_bike_stats", JSON.stringify(statCardsData));
      if (!silent) setStatus("");
    }

    updateLastUpdated();
    localStorage.setItem("cached_last_updated", $("lastUpdated").textContent);
    const recBtn = $("reconnectBtn");
    if (recBtn) recBtn.hidden = true;
    rateLimitBackoff = 0;
  }
  catch (error) {
    if (error.message === "AUTH_PAUSED") {
      const recBtn = $("reconnectBtn");
      if (recBtn) recBtn.hidden = false;
      if (!silent) setStatus("Offline (cached data). Tap Reconnect to sync.", false);
      return;
    }
    if (error.message === "RATE_LIMIT") {
      rateLimitBackoff = Math.min(rateLimitBackoff + 1, 5);
      setTimeout(() => {
        if (accessToken && !document.hidden) load({ silent: true });
      }, Math.pow(2, rateLimitBackoff) * 1000);
    } else {
      setStatus(error.message, true);
    }
  }
  finally {
    syncInProgress = false;
    $("refreshBtn").disabled = false;
  }
}

/* =========================================================
   AUTO SYNC & VISIBILITY
========================================================= */

function startAutoSync() {
  stopAutoSync();
  if (!accessToken || document.hidden) return;
  syncTimer = setInterval(() => {
    if (!accessToken || document.hidden || syncInProgress) return;
    load({ silent: true });
  }, CONFIG.syncInterval);
}

function stopAutoSync() {
  if (syncTimer !== null) {
    clearInterval(syncTimer);
    syncTimer = null;
  }
}

document.addEventListener("visibilitychange", async () => {
  if (document.hidden) {
    stopAutoSync();
  } else {
    const ok = await ensureValidToken(false);
    if (ok) {
      load({ silent: true });
      startAutoSync();
    }
  }
});

/* =========================================================
   CONFETTI
========================================================= */

function confettiExplosion(button) {
  const rect = button.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const colors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93", "#ff70a6", "#00c2a8"];
  
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement("div");
    piece.style.position = "fixed";
    piece.style.left = centerX + "px";
    piece.style.top = centerY + "px";
    piece.style.width = (5 + Math.random() * 7) + "px";
    piece.style.height = (7 + Math.random() * 10) + "px";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    piece.style.pointerEvents = "none";
    piece.style.zIndex = "9999";

    const angle = Math.random() * Math.PI * 2;
    const velocity = 100 + Math.random() * 220;
    const x = Math.cos(angle) * velocity;
    const y = Math.sin(angle) * velocity;

    piece.animate([
      { transform: "translate(-50%, -50%) rotate(0deg)", opacity: 1 },
      { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y + 140}px)) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
    ], {
      duration: 700 + Math.random() * 600,
      easing: "cubic-bezier(.15,.8,.3,1)"
    });

    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 1400);
  }
}

function renderStatsGrid() {
  const grid = $("statsGrid");
  grid.innerHTML = "";

  const total = statCardsData.length;
  statCardsData.forEach((stat, index) => {
    const card = document.createElement("div");
    card.className = "stat-card";
    const isPercent = /%|percent/i.test(stat.label);
    if (index === total - 1 && (isPercent || total % 2 !== 0)) {
      card.classList.add("stat-card-last");
    }

    const labelDiv = document.createElement("div");
    labelDiv.className = "stat-label";
    labelDiv.textContent = stat.label;

    const valueDiv = document.createElement("div");
    valueDiv.className = "stat-value";
    valueDiv.textContent = stat.value;

    card.append(labelDiv, valueDiv);
    grid.append(card);
  });
}

function getItemCategory(item) {
  return item.category || categorizeItem(item.value);
}

function getItemIcon(item) {
  if (item.icon) return item.icon;
  return getItemDetails(item.value).icon;
}

function getItemBgColor(item) {
  if (item.color) return item.color;
  return getItemDetails(item.value).bg;
}

function renderGroceries() {
  const list = $("list");
  list.innerHTML = "";

  if (!items.length) {
    $("empty").hidden = false;
    return;
  }
  $("empty").hidden = true;

  const groups = {};
  CATEGORY_ORDER.forEach(cat => groups[cat] = []);
  items.forEach(item => groups[getItemCategory(item)].push(item));

  CATEGORY_ORDER.forEach(category => {
    const categoryItems = groups[category];
    if (!categoryItems.length) return;

    const section = document.createElement("section");
    section.className = "grocery-section";

    const heading = document.createElement("div");
    heading.className = "grocery-section-heading";

    const icon = document.createElement("span");
    icon.className = "category-icon";
    icon.textContent = CATEGORY_ICONS[category];

    const title = document.createElement("span");
    title.textContent = category;

    heading.append(icon, title);
    section.append(heading);

    categoryItems.forEach(item => {
      const details = getItemDetails(item.value);
      const row = document.createElement("div");
      row.className = "item";
      row.style.backgroundColor = getItemBgColor(item);
      row.style.borderLeft = `5px solid ${details.color}`;
      row.style.borderRadius = "8px";
      row.style.margin = "6px 0";
      row.style.padding = "10px 14px";
      row.style.display = "flex";
      row.style.alignItems = "center";
      row.style.justifyContent = "space-between";

      if (editingItemRow === item.row) {
        row.classList.add("editing");

        const editForm = document.createElement("form");
        editForm.className = "edit-form-expanded";

        const mainRow = document.createElement("div");
        mainRow.className = "edit-row-main";

        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.className = "edit-input";
        editInput.value = item.value;
        editInput.setAttribute("aria-label", "Edit item name");

        const actions = document.createElement("div");
        actions.className = "edit-actions";

        const saveBtn = document.createElement("button");
        saveBtn.type = "submit";
        saveBtn.className = "save-btn";
        saveBtn.textContent = "Save";

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "cancel-btn";
        cancelBtn.textContent = "Cancel";
        cancelBtn.onclick = (e) => {
          e.stopPropagation();
          editingItemRow = null;
          renderGroceries();
        };

        actions.append(saveBtn, cancelBtn);
        mainRow.append(editInput, actions);

        const controlsRow = document.createElement("div");
        controlsRow.className = "edit-row-controls";

        const catLabel = document.createElement("label");
        catLabel.className = "preview-field";
        const catSpan = document.createElement("span");
        catSpan.className = "preview-label";
        catSpan.textContent = "Category:";

        const catSelect = document.createElement("select");
        catSelect.className = "category-select";
        CATEGORY_ORDER.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          if (c === getItemCategory(item)) opt.selected = true;
          catSelect.append(opt);
        });
        catLabel.append(catSpan, catSelect);

        let selectedEditIcon = getItemIcon(item);
        const iconBtn = document.createElement("button");
        iconBtn.type = "button";
        iconBtn.className = "icon-picker-btn";
        iconBtn.textContent = selectedEditIcon;
        iconBtn.title = "Choose Icon";
        iconBtn.onclick = (e) => {
          e.stopPropagation();
          openIconPicker((newIcon) => {
            selectedEditIcon = newIcon;
            iconBtn.textContent = newIcon;
          });
        };

        let selectedEditColor = getItemBgColor(item);
        const colorLabel = document.createElement("label");
        colorLabel.className = "color-picker-wrapper";
        colorLabel.title = "Choose Color";

        const colorInput = document.createElement("input");
        colorInput.type = "color";
        colorInput.value = selectedEditColor.startsWith("#") && selectedEditColor.length === 7 ? selectedEditColor : "#ffffff";

        const colorSwatch = document.createElement("span");
        colorSwatch.className = "color-swatch";
        colorSwatch.style.backgroundColor = selectedEditColor;
        colorSwatch.textContent = "🎨";

        colorInput.oninput = (e) => {
          selectedEditColor = e.target.value;
          colorSwatch.style.backgroundColor = selectedEditColor;
        };

        colorLabel.append(colorInput, colorSwatch);

        controlsRow.append(catLabel, iconBtn, colorLabel);
        editForm.append(mainRow, controlsRow);

        editForm.onsubmit = (e) => {
          e.preventDefault();
          const newValue = editInput.value.trim();
          if (newValue) {
            updateGroceryItem(item, newValue, catSelect.value, selectedEditIcon, selectedEditColor);
          } else {
            editingItemRow = null;
            renderGroceries();
          }
        };

        editInput.onkeydown = (e) => {
          if (e.key === "Escape") {
            editingItemRow = null;
            renderGroceries();
          }
        };

        row.append(editForm);
        section.append(row);

        setTimeout(() => editInput.focus(), 50);

      } else {
        const itemIcon = document.createElement("span");
        itemIcon.textContent = getItemIcon(item);
        itemIcon.style.marginRight = "10px";
        itemIcon.style.fontSize = "1.2rem";

        const name = document.createElement("span");
        name.textContent = item.value;
        name.style.color = details.color;
        name.style.fontWeight = "600";
        name.style.flexGrow = "1";

        const done = document.createElement("button");
        done.className = "remove";
        done.textContent = "Done";
        done.onclick = (e) => {
          e.stopPropagation();
          done.disabled = true;
          confettiExplosion(done);
          removeGroceryItem(item);
        };

        row.append(itemIcon, name, done);

        let pressTimer = null;
        let startX = 0;
        let startY = 0;

        const cancelPress = () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
          row.classList.remove("holding");
        };

        const startPress = (e) => {
          if (e.button && e.button !== 0) return;
          if (e.target.closest(".remove")) return;

          cancelPress();
          startX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          startY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

          row.classList.add("holding");

          pressTimer = setTimeout(() => {
            row.classList.remove("holding");
            if (navigator.vibrate) {
              try { navigator.vibrate(40); } catch (err) {}
            }
            editingItemRow = item.row;
            renderGroceries();
          }, 500);
        };

        const movePress = (e) => {
          if (!pressTimer) return;
          const currentX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const currentY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          const diffX = Math.abs(currentX - startX);
          const diffY = Math.abs(currentY - startY);
          if (diffX > 8 || diffY > 8) {
            cancelPress();
          }
        };

        row.addEventListener("pointerdown", startPress);
        row.addEventListener("pointerup", cancelPress);
        row.addEventListener("pointercancel", cancelPress);
        row.addEventListener("pointerleave", cancelPress);
        row.addEventListener("pointermove", movePress);
        row.addEventListener("contextmenu", (e) => {
          if (pressTimer || row.classList.contains("holding")) {
            e.preventDefault();
          }
        });

        section.append(row);
      }
    });

    list.append(section);
  });
}

async function updateGroceryItem(item, newValue, newCategory, newIcon, newColor) {
  if (!item || !newValue) return;
  editingItemRow = null;
  setStatus("Saving…");
  const oldState = { ...item };
  item.value = newValue;
  item.category = newCategory || null;
  item.icon = newIcon || null;
  item.color = newColor || null;
  localStorage.setItem("cached_groceries", JSON.stringify(items));
  renderGroceries();

  try {
    const ok = await ensureValidToken(true);
    if (!ok) {
      setStatus("Updated locally. Tap Reconnect to sync with Google.", false);
      return;
    }
    const rangeA1 = `${CONFIG.sheetName}!A${item.row}:D${item.row}`;
    await sheetsFetch(`/values/${encodeURIComponent(rangeA1)}?valueInputOption=USER_ENTERED`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ range: rangeA1, majorDimension: "ROWS", values: [[newValue, newCategory || "", newIcon || "", newColor || ""]] })
    });
    await load();
  } catch (error) {
    if (error.message === "AUTH_PAUSED") {
      setStatus("Updated locally. Tap Reconnect to sync with Google.", false);
    } else {
      Object.assign(item, oldState);
      localStorage.setItem("cached_groceries", JSON.stringify(items));
      renderGroceries();
      setStatus("Couldn't update item: " + error.message, true);
    }
  }
}

function renderBikeList() {
  const list = $("bikeList");
  list.innerHTML = "";

  const today = new Date();
  const todayStr = `${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()}`;
  $("addTodayBtn").hidden = bikeDates.some(d => d.value === todayStr);

  [...bikeDates].reverse().forEach(item => {
    const div = document.createElement("div");
    div.className = "bike-date-row";
    div.textContent = item.value;
    list.append(div);
  });
}

function initCategorySelects() {
  const sel = $("addCategorySelect");
  if (!sel) return;
  sel.innerHTML = "";
  CATEGORY_ORDER.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    sel.append(opt);
  });
}

function updateAddFormPreview() {
  const text = $("itemInput").value.trim();
  if (!userHasManuallyChangedCategory) {
    const autoCat = text ? categorizeItem(text) : "Produce";
    $("addCategorySelect").value = autoCat;
  }
  if (!userHasManuallyChangedIcon) {
    currentAddIcon = text ? getItemDetails(text).icon : "🛒";
    $("addIconBtn").textContent = currentAddIcon;
  }
}

let currentSuggestion = null;

function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getSuggestion(typed) {
  if (!typed || !typed.trim()) return null;
  const clean = typed.trim().toLowerCase();
  return GROCERY_DICTIONARY.find(item => item.toLowerCase().startsWith(clean) && item.toLowerCase() !== clean) || null;
}

function updateGhostText() {
  const input = $("itemInput");
  const typed = input.value;
  const overlay = $("ghostTextOverlay");
  const badge = $("ghostTextBadge");
  
  if (!typed || !typed.trim()) {
    overlay.innerHTML = "";
    badge.hidden = true;
    currentSuggestion = null;
    return;
  }

  const match = getSuggestion(typed);
  if (match) {
    currentSuggestion = match;
    const suffix = match.slice(typed.length);
    overlay.innerHTML = `<span class="ghost-text-typed">${escapeHtml(typed)}</span><span class="ghost-text-suffix">${escapeHtml(suffix)}</span>`;
    badge.hidden = false;
    badge.textContent = `⇥ ${match}`;
  } else {
    overlay.innerHTML = "";
    badge.hidden = true;
    currentSuggestion = null;
  }
}

function acceptSuggestion() {
  if (currentSuggestion) {
    $("itemInput").value = currentSuggestion;
    updateGhostText();
    updateAddFormPreview();
  }
}

function resetAddFormState() {
  userHasManuallyChangedCategory = false;
  userHasManuallyChangedIcon = false;
  userCustomColor = null;
  currentAddIcon = "🛒";
  currentSuggestion = null;
  $("addIconBtn").textContent = "🛒";
  $("addColorInput").value = "#ffffff";
  $("addColorSwatch").style.backgroundColor = "#ffffff";
  $("ghostTextOverlay").innerHTML = "";
  $("ghostTextBadge").hidden = true;
  updateAddFormPreview();
}

function openIconPicker(onSelect) {
  activeIconPickerCallback = onSelect;
  $("iconSearchInput").value = "";
  renderIconGrid("");
  $("iconModal").hidden = false;
  setTimeout(() => $("iconSearchInput").focus(), 50);
}

function closeIconPicker() {
  $("iconModal").hidden = true;
  activeIconPickerCallback = null;
}

$("closeIconModal").onclick = closeIconPicker;
$("iconModal").onclick = (e) => {
  if (e.target === $("iconModal")) closeIconPicker();
};

$("iconSearchInput").addEventListener("input", (e) => {
  renderIconGrid(e.target.value.toLowerCase().trim());
});

function renderIconGrid(query) {
  const grid = $("iconGrid");
  grid.innerHTML = "";

  const filtered = query
    ? ICON_LIBRARY.filter(item => item.name.includes(query) || item.icon.includes(query))
    : ICON_LIBRARY;

  filtered.forEach(item => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "icon-item";
    btn.textContent = item.icon;
    btn.title = item.name;
    btn.onclick = () => {
      if (activeIconPickerCallback) {
        activeIconPickerCallback(item.icon);
      }
      closeIconPicker();
    };
    grid.append(btn);
  });

  if (!filtered.length) {
    const emptyMsg = document.createElement("div");
    emptyMsg.style.gridColumn = "1 / -1";
    emptyMsg.style.textAlign = "center";
    emptyMsg.style.padding = "20px";
    emptyMsg.style.opacity = "0.6";
    emptyMsg.textContent = "No icons found matching '" + query + "'";
    grid.append(emptyMsg);
  }
}

$("itemInput").addEventListener("input", () => {
  updateGhostText();
  updateAddFormPreview();
});

$("itemInput").addEventListener("keydown", (e) => {
  if ((e.key === "Tab" || e.key === "ArrowRight") && currentSuggestion) {
    const input = $("itemInput");
    // Accept autocomplete on Tab or if cursor is at the end of the text on ArrowRight
    if (e.key === "Tab" || input.selectionStart === input.value.length) {
      e.preventDefault();
      acceptSuggestion();
    }
  }
});

$("ghostTextBadge").onclick = (e) => {
  e.preventDefault();
  acceptSuggestion();
  $("itemInput").focus();
};

$("addCategorySelect").addEventListener("change", () => {
  userHasManuallyChangedCategory = true;
});

$("addColorInput").addEventListener("input", (e) => {
  userCustomColor = e.target.value;
  $("addColorSwatch").style.backgroundColor = userCustomColor;
});

$("addIconBtn").onclick = () => {
  openIconPicker((selectedIcon) => {
    currentAddIcon = selectedIcon;
    userHasManuallyChangedIcon = true;
    $("addIconBtn").textContent = selectedIcon;
  });
};

/* =========================================================
   ACTIONS
========================================================= */

async function addGroceryItem(value, category, icon, color) {
  setStatus("Adding…");
  try {
    const ok = await ensureValidToken(true);
    if (!ok) {
      setStatus("Please tap Reconnect to sync with Google.", true);
      return;
    }
    const values = await sheetsFetch(`/values/${encodeURIComponent(CONFIG.sheetName + "!A:A")}?majorDimension=ROWS`);
    const rows = values.values || [];
    let target = rows.findIndex(row => !String(row[0] ?? "").trim());
    if (target < 0) target = rows.length;

    const rangeA1 = `${CONFIG.sheetName}!A${target + 1}:D${target + 1}`;
    await sheetsFetch(`/values/${encodeURIComponent(rangeA1)}?valueInputOption=USER_ENTERED`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ range: rangeA1, majorDimension: "ROWS", values: [[value, category || "", icon || "", color || ""]] })
    });

    $("itemInput").value = "";
    resetAddFormState();
    await load();
  } catch (error) {
    if (error.message === "AUTH_PAUSED") {
      setStatus("Please tap Reconnect to sync with Google.", true);
    } else {
      setStatus(error.message === "RATE_LIMIT" ? "Google rate limit reached. Please try again." : error.message, true);
    }
  }
}

$("addTodayBtn").onclick = async () => {
  setStatus("Adding today's ride...");
  $("addTodayBtn").disabled = true;
  try {
    const ok = await ensureValidToken(true);
    if (!ok) {
      setStatus("Please tap Reconnect to sync with Google.", true);
      return;
    }
    const today = new Date();
    const todayStr = `${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()}`;
    const values = await sheetsFetch(`/values/${encodeURIComponent(CONFIG.bikeSheetName + "!A:A")}?majorDimension=ROWS`);
    const rows = values.values || [];
    let target = rows.findIndex(row => !String(row[0] ?? "").trim());
    if (target < 0) target = rows.length;

    const rangeA1 = `${CONFIG.bikeSheetName}!A${target + 1}`;
    await sheetsFetch(`/values/${encodeURIComponent(rangeA1)}?valueInputOption=USER_ENTERED`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ range: rangeA1, majorDimension: "ROWS", values: [[todayStr]] })
    });

    confettiExplosion($("addTodayBtn"));
    await load();
  } catch (error) {
    if (error.message === "AUTH_PAUSED") {
      setStatus("Please tap Reconnect to sync with Google.", true);
    } else {
      setStatus("Error saving ride: " + error.message, true);
    }
  } finally {
    $("addTodayBtn").disabled = false;
  }
};

async function removeGroceryItem(item) {
  if (!item) return;
  setStatus("Removing…");
  const previousItems = [...items];
  items = items.filter(current => current !== item);
  localStorage.setItem("cached_groceries", JSON.stringify(items));
  renderGroceries();

  try {
    const ok = await ensureValidToken(true);
    if (!ok) {
      setStatus("Removed locally. Tap Reconnect to sync.", false);
      return;
    }
    await sheetsFetch(`/values/${encodeURIComponent(CONFIG.sheetName + "!A" + item.row)}:clear`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });
    await load();
  } catch (error) {
    if (error.message === "AUTH_PAUSED") {
      setStatus("Removed locally. Tap Reconnect to sync with Google.", false);
    } else {
      items = previousItems;
      localStorage.setItem("cached_groceries", JSON.stringify(items));
      renderGroceries();
      setStatus("Couldn't delete the item: " + error.message, true);
    }
  }
}

$("addForm").onsubmit = event => {
  event.preventDefault();
  const value = $("itemInput").value.trim();
  const category = $("addCategorySelect").value;
  const icon = currentAddIcon;
  const color = userCustomColor;
  if (value) addGroceryItem(value, category, icon, color);
};

$("refreshBtn").onclick = () => load();

$("signOutBtn").onclick = () => {
  stopAutoSync();
  if (accessToken && google?.accounts?.oauth2) {
    google.accounts.oauth2.revoke(accessToken, () => {});
  }
  accessToken = null;
  localStorage.removeItem("google_access_token");
  localStorage.removeItem("google_token_expiry");
  localStorage.removeItem("autoLogin");
  localStorage.removeItem("has_connected_google");
  localStorage.removeItem("cached_groceries");
  localStorage.removeItem("cached_bike_dates");
  localStorage.removeItem("cached_bike_stats");
  localStorage.removeItem("cached_last_updated");
  appPanel.hidden = true;
  loginCard.hidden = false;
  $("lastUpdated").textContent = "Last updated: —";
  setLoginStatus("Signed out.");
};

/* =========================================================
   INITIAL LOAD & CACHE RESTORATION
========================================================= */

function restoreLocalCache() {
  const hasConnected = localStorage.getItem("has_connected_google") === "true" || localStorage.getItem("autoLogin") === "true";
  const cachedGroceries = localStorage.getItem("cached_groceries");
  const cachedBikeDates = localStorage.getItem("cached_bike_dates");
  const cachedBikeStats = localStorage.getItem("cached_bike_stats");
  const cachedLastUpdated = localStorage.getItem("cached_last_updated");

  if (hasConnected || cachedGroceries) {
    loginCard.hidden = true;
    appPanel.hidden = false;

    if (cachedGroceries) {
      try {
        items = JSON.parse(cachedGroceries);
        renderGroceries();
        setStatus(items.length ? `${items.length} item${items.length === 1 ? "" : "s"}` : "");
      } catch {}
    }
    if (cachedBikeDates) {
      try {
        bikeDates = JSON.parse(cachedBikeDates);
        renderBikeList();
      } catch {}
    }
    if (cachedBikeStats) {
      try {
        statCardsData = JSON.parse(cachedBikeStats);
        renderStatsGrid();
      } catch {}
    }
    if (cachedLastUpdated) {
      $("lastUpdated").textContent = cachedLastUpdated;
    }
  }
}

// Restore cached UI immediately on script execution!
restoreLocalCache();

window.addEventListener("load", () => {
  initCategorySelects();

  const recBtn = $("reconnectBtn");
  if (recBtn) {
    recBtn.onclick = async () => {
      setStatus("Reconnecting to Google…");
      const ok = await requestUserAuth();
      if (ok) {
        await load();
        startAutoSync();
      }
    };
  }

  const hasConnected = localStorage.getItem("has_connected_google") === "true" || localStorage.getItem("autoLogin") === "true";
  if (hasConnected) {
    setTimeout(async () => {
      const ok = await ensureValidToken(false);
      if (ok) {
        load({ silent: true });
        startAutoSync();
      } else {
        const btn = $("reconnectBtn");
        if (btn) btn.hidden = false;
      }
    }, 300);
  }
});

</script>
